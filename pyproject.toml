[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operations-forecasting-system"
version = "0.1.0"
description = "Inventory forecasting and reorder recommendations from an Excel workflow, with human review and preserved forecast history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1.5"]

[project.scripts]
operations-forecast-demo = "operations_forecasting.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
